name: App Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_REVIEW_EMAIL: appreview@conectcampo.digital
      APP_REVIEW_PASSWORD: ${{ secrets.APP_REVIEW_PASSWORD }}
      APP_BASE_URL: https://app.conectcampo.digital
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture production screens
        run: node .github/scripts/capture-app-store-screenshots.mjs

      - name: Upload App Store assets
        uses: actions/upload-artifact@v4
        with:
          name: conectcampo-app-store-screenshots
          path: app-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
