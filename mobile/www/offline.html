<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; navigate-to https://app.conectcampo.digital" />
    <title>Reconectar ao ConectCampo</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f7faf8; color: #16372b; }
      main { width: min(100%, 32rem); padding: max(2.5rem, env(safe-area-inset-top)) 1.5rem max(2.5rem, env(safe-area-inset-bottom)); text-align: center; }
      .brand { color: #008c3c; font-size: 1rem; font-weight: 800; letter-spacing: .04em; }
      .icon { width: 4.5rem; height: 4.5rem; margin: 2rem auto 1.5rem; display: grid; place-items: center; border-radius: 1.5rem; background: #e7f8ed; color: #006830; font-size: 2rem; }
      h1 { margin: 0; color: #003c28; font-size: 1.8rem; line-height: 1.15; letter-spacing: -.035em; }
      p { margin: 1rem auto 1.5rem; max-width: 27rem; color: #5c7168; line-height: 1.55; }
      a { display: block; min-height: 3.25rem; padding: .95rem 1.35rem; border-radius: 1rem; background: #008c3c; color: #fff; font-weight: 750; text-decoration: none; }
      a:focus-visible { outline: 3px solid #b48c3c; outline-offset: 4px; }
      small { display: block; margin-top: 1.25rem; color: #72827b; line-height: 1.45; }
      @media (prefers-color-scheme: dark) { body { background: #0a0f0c; color: #eef7f0; } .icon { background: #123b29; color: #5de6a0; } h1 { color: #eff7f1; } p, small { color: #a8b7ae; } a { background: #00a03c; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">CONECTCAMPO</div>
      <div class="icon" aria-hidden="true">↻</div>
      <h1>Vamos reconectar?</h1>
      <p>Não foi possível abrir a plataforma agora. Verifique sua internet e tente novamente.</p>
      <a href="https://app.conectcampo.digital">Tentar novamente</a>
      <small>Esta tela funciona sem internet. Seus dados permanecem protegidos; operações, documentos e assinaturas precisam de conexão.</small>
    </main>
  </body>
</html>
